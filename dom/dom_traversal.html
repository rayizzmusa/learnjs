<!DOCTYPE html>
<html>

<head>
    <title>DOM Traversal</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<style>
    body {
        margin: 50px;
        font-family: arial;
        background-color: #666;
    }

    .container {
        width: 900px;
        margin: auto;
    }

    .card {
        display: inline-block;
        width: 220px;
        padding: 0 80px;
        height: 80px;
        font-size: 16px;
        line-height: 80px;
        border-radius: 40px;
        background-color: #f1f1f1;
        margin: 20px;
        position: relative;
        text-align: center;
    }

    .card img {
        float: left;
        margin: 0 10px 0 -80px;
        height: 80px;
        width: 80px;
        border-radius: 50%;
        position: relative;
    }

    .card .nama,
    .card .telp {
        display: block;
        line-height: 20px;
        padding: 0 5px;
    }

    .card .nama {
        margin-left: 20px;
        margin-top: 20px;
        font-size: 20px;
    }

    .card .telp {
        margin-left: 20px;
        margin-top: 5px;
        font-size: 16px;
        color: #aaa;
    }

    .card .close {
        font-size: 24px;
        font-weight: bold;
        color: #999;
        position: absolute;
        top: 0;
        right: 30px;
        cursor: pointer;
    }

    .card:hover .close {
        color: red;
    }
</style>

<body>

    <div class="container">

        <div class="card">
            <img src="img/syifa.jpg" width="96" height="96">
            <span class="nama">Sandhika Galih</span>
            <span class="telp">08123456789</span>
            <span class="close">×</span>
        </div>

        <div class="card">
            <img src="img/syifa.jpg" width="96" height="96">
            <span class="nama">Sandhik</span>
            <span class="telp">08123456789</span>
            <span class="close">×</span>
        </div>

        <div class="card">
            <img src="img/syifa.jpg" width="96" height="96">
            <span class="nama">Sandhika</span>
            <span class="telp">08123456789</span>
            <span class="close">×</span>
        </div>

        <div class="card">
            <img src="img/syifa.jpg" width="96" height="96">
            <span class="nama">Galih</span>
            <span class="telp">08123456789</span>
            <span class="close">×</span>
        </div>

    </div>

</body>

</html>

<script>

    //dom traveersal
    //menelusi parent dll
    const closeBtn = document.querySelectorAll('.close');
    for (let i = 0; i < closeBtn.length; i++) {
        closeBtn[i].addEventListener('click', function (event) {
            //closeBtn[i].parentElement.remove();
            //this.parentElement.remove();
            //atau pakai css display = 'none'
            //tiga diatas kalau tanpa parameter function

            //kalau pakai parameter
            event.target.parentElement.remove();
        })
    }

    const nama = document.querySelector('.nama');
    console.log(nama.parentElement.parentElement);
</script>
