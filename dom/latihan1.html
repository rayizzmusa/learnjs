<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 1 DOM</title>
    <style>
        body {
            text-align: center;
        }

        .Merah {
            background-color: red;
        }
    </style>
</head>

<body>
    <h1>Bermain Dengan Warna</h1>
    <button type="button" id="merah" class="merah">Merah</button>
</body>

</html>
<script>
    const btnMerah = document.getElementById('merah');
    btnMerah.addEventListener("click", function () {
        document.body.style.backgroundColor = 'red';
        btnMerah.innerHTML = "Putih";
        //bisa juga pakai toggle

        //menambah tombolnya pake js
        const btnBaru = document.createElement('button');
        const mark = document.createTextNode('Random');
        btnBaru.appendChild(mark);
        btnBaru.setAttribute('type', 'button');
        btnBaru.setAttribute('id', 'random')
        btnMerah.after(btnBaru);

        //membuat warna random
        const btnRandom = document.getElementById('random');
        btnRandom.onclick = function () {
            const r = Math.round(Math.random() * 255 + 1);
            const g = Math.round(Math.random() * 255 + 1);
            const b = Math.round(Math.random() * 255 + 1);
            document.body.style.backgroundColor = 'rgb(' + r + ',' + g + ',' + b + ')';
        }
    });
