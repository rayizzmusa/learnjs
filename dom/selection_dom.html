<body>

<h1 id="judul">Hello World</h1>
<div id="container">
    <section id="a">
        <p class="p1">paragraf 1</p>
        <a href="http://instagram.com/sandhikagalih">Instagram Sandhika Galih</a>
        <p class="p2">paragraf 2</p>
        <p class="p3">paragraf 3</p>
    </section>
    <section id="b">
        <p>paragraf 4</p>
        <ul>
            <li>item 1</li>
            <li>item 2</li>
            <li>item 3</li>
        </ul>
    </section>
</div>

<!-- <script src="selection_dom.js"></script> -->
</body>
</html>

<!-- selection dom part 2 querySelector dan querySelectiorAll = biasanya digunakan untuk element yang tidak ada element id, class-->
<script>
    //document.querySelector() mengembalikan element, selector yang dimaksud adalah selectior css
    const p4 = document.querySelector('#b p');
    p4.style.color = 'green';

    const li2 = document.querySelector('section#b ul li:nth-child(2)');
    li2.style.backgroundColor = 'orange';

    //document.querySelectorAll() mengembalikan node list, untuk memilih semua selector
    const p = document.querySelectorAll('p')[1];
    p.style.backgroundColor = 'blue';

</script>
